name: Agent cohort

# Paid: plays one cohort against the Claude API, or runs the content auditor. The job
# authenticates with workload identity federation: it proves who it is with a GitHub OIDC
# token, so no API key exists anywhere. Setup: agents/README.md, "Paid runs".
on:
  workflow_dispatch:
    inputs:
      persona:
        description: Cohort to play (calibration plays the Haiku players and the Sonnet critic side by side; content-audit runs the content auditor instead)
        type: choice
        required: true
        default: calibration
        options:
          - calibration
          - fun-casual
          - fun-insider
          - fun-completionist
          - fun-critic
          - fun-critic-haiku
          - content-audit
          - blind-insider
          - blind-general
          - blind-international
          - lineage
          - veteran
          - breaker
      dry_run:
        description: Dry run (3 runs, or 2 sessions for a fun persona, 1 per persona for calibration; then the projected cost of the full cohort)
        type: boolean
        default: true
      runs:
        description: Number of runs, or sessions for a fun persona (optional; empty = the persona's own count; ignored by calibration and content-audit)
        type: string
        required: false
        default: ''
      max_usd:
        description: Spend cap in USD for this job, on top of the cohort's own cap (optional; empty = none; calibration is capped at $2 regardless; ignored by content-audit)
        type: string
        required: false
        default: ''

permissions:
  id-token: write
  contents: write   # to publish the reports to the playtest-results branch

# One run per persona at a time, so two dispatches never spend the same cohort's cap twice.
concurrency:
  group: cohort-${{ inputs.persona }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  cohort:
    name: ${{ inputs.persona }}${{ inputs.dry_run && ' (dry run)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # Federation identifiers, not secrets. No `environment:` here: it would change the token subject
      # to repo:...:environment:..., and the rule matches repo:cwhcgit/minister-salary:ref:refs/heads/main.
      ANTHROPIC_FEDERATION_RULE_ID: fdrl_01CYm8iJcdD1ZtSrR1gKpdMM
      ANTHROPIC_ORGANIZATION_ID: 2f3a39e4-5a60-4ee0-9db1-1634ed555743
      ANTHROPIC_SERVICE_ACCOUNT_ID: svac_012M6HPUHTmfwquraMjux41T
      ANTHROPIC_WORKSPACE_ID: wrkspc_014M7AmfQuPoyQccxD9agdEB
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/anthropic-wif/github-oidc.jwt
      PLAYTEST_REQUIRE_WIF: "1"
      PERSONA: ${{ inputs.persona }}
      DRY_RUN: ${{ inputs.dry_run }}
      RUNS: ${{ inputs.runs }}
      MAX_USD: ${{ inputs.max_usd }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: Install the agent runner
        working-directory: agents
        run: npm ci --no-fund --no-audit

      - name: No API key in this job
        run: .github/scripts/anthropic-wif.sh check

      - name: Fetch the GitHub OIDC token and keep it fresh
        run: .github/scripts/anthropic-wif.sh start

      - name: Play
        run: |
          log="$RUNNER_TEMP/cohort.log"
          if [ "$PERSONA" = content-audit ]; then
            node agents/audit.ts | tee "$log"
          else
            args=(play "$PERSONA")
            if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
            # Optional overrides, passed through only when set. Validated so a typo fails here, not mid-cohort.
            if [ -n "$RUNS" ]; then
              [[ "$RUNS" =~ ^[1-9][0-9]*$ ]] || { echo "::error::runs must be a whole number above 0, got '$RUNS'"; exit 1; }
              args+=(--runs "$RUNS")
            fi
            if [ -n "$MAX_USD" ]; then
              [[ "$MAX_USD" =~ ^[0-9]+(\.[0-9]+)?$ ]] && [[ ! "$MAX_USD" =~ ^0+(\.0+)?$ ]] || { echo "::error::max_usd must be a dollar amount above 0, got '$MAX_USD'"; exit 1; }
              args+=(--max-usd "$MAX_USD")
            fi
            echo "runner: node agents/runner.ts ${args[*]}"
            node agents/runner.ts "${args[@]}" | tee "$log"
            if [ "$PERSONA" = lineage ] && [ "$DRY_RUN" != true ]; then
              # A new process makes its own first exchange, so give it a token nobody has used.
              .github/scripts/anthropic-wif.sh refresh
              cohort=(reports/cohorts/*-lineage-*/)   # a fresh checkout holds only this one
              node agents/runner.ts score "${cohort[0]}" --no-batch | tee -a "$log"
            fi
          fi
          {
            echo "### $PERSONA$([ "$DRY_RUN" = true ] && echo ' (dry run)')"
            echo '```'
            grep -E "credentials:|===|spent|projected|completed|canaries|interest by act|behaviour|fun:|careers:|cost per tap|calibration|findings|total spent|→" "$log" || true
            echo '```'
            # Fun-meter cohorts write a short report (and calibration a comparison): show them here too.
            for f in reports/cohorts/*/calibration.md reports/cohorts/*/report.md; do
              if [ -f "$f" ]; then echo; cat "$f"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop the token refresher
        if: always()
        run: .github/scripts/anthropic-wif.sh stop

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.persona }}-${{ inputs.dry_run && 'dry-run' || 'cohort' }}-${{ github.run_id }}
          path: |
            reports/cohorts/
            reports/audit/
          if-no-files-found: warn
          retention-days: 90

      - name: Publish the reports to the playtest-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-results.sh "$PERSONA$([ "$DRY_RUN" = true ] && echo -dry)" reports/cohorts reports/audit
