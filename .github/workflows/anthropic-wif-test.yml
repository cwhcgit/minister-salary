name: anthropic-wif-test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
            // The claims are not secret; printing them makes a rule mismatch easy to spot.
            const c = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            core.notice(`sub=${c.sub} aud=${c.aud} ref=${c.ref} event_name=${c.event_name} repository_owner_id=${c.repository_owner_id}`, { title: 'GitHub token claims' });
      - name: Exchange for an Anthropic access token
        # Fails the job unless an access token comes back, so a green run means WIF works.
        run: |
          curl -sS https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- > response.json <<JSON
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_01CYm8iJcdD1ZtSrR1gKpdMM",
            "organization_id": "2f3a39e4-5a60-4ee0-9db1-1634ed555743",
            "service_account_id": "svac_012M6HPUHTmfwquraMjux41T",
            "workspace_id": "wrkspc_014M7AmfQuPoyQccxD9agdEB"
          }
          JSON
          jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)' response.json
          if jq -e '.access_token | startswith("sk-ant-oat01-")' response.json > /dev/null; then
            echo "::notice title=WIF OK::Exchanged the GitHub token for an Anthropic access token (expires in $(jq -r .expires_in response.json)s)"
          else
            echo "::error title=WIF failed::$(jq -c 'del(.access_token)' response.json)"
            exit 1
          fi
          rm -f response.json
