name: Regenerate the card deck

# docs/DECK.md and docs/DECK-DESIGN.md are generated from the game's content (tools/deck.js).
# After every change to main that touches the content or the generator, rebuild them and commit
# the result, so the deck is always current, including after an edit made from a phone.
# A commit pushed with GITHUB_TOKEN does not start other workflows, so this cannot loop.

on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/**', '.github/workflows/deck.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deck
  cancel-in-progress: false

jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the deck
        run: node tools/deck.js && node tools/deck.js --check
      - name: Commit it if it changed
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs
            git commit -m "Regenerate the card deck"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
