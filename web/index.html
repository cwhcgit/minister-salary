<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Minister Salary</title>
<style>
:root{
  --bg:#14171c; --panel:#1c2028; --panel2:#232833; --line:#2e3542;
  --ink:#e8e6e1; --dim:#8e97a6; --faint:#5d6675;
  --rep:#6aa9e0; --std:#c9a227; --int:#5fb98a; --com:#b07fd0; --cash:#d4574e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overscroll-behavior-y:none;
}
#app{max-width:600px;margin:0 auto;padding:14px 14px 28px;min-height:100vh}
.serif{font-family:ui-serif,Georgia,"Times New Roman",serif}

/* ---- header ---- */
header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 78%,transparent);padding-bottom:10px;margin:0 -14px;padding-left:14px;padding-right:14px}
.rankline{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rank{font-size:17px;font-weight:600;letter-spacing:-.01em}
.grade{font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:7px;font-variant-numeric:tabular-nums}
.sub{font-size:12.5px;color:var(--dim);margin-top:1px}
.cash{font-size:17px;font-weight:700;color:var(--cash);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- stat bars ---- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}
.stat{background:var(--panel);border-radius:7px;padding:6px 7px}
.stat .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.25}
.track{height:3px;background:#000;border-radius:2px;overflow:hidden;margin-top:4px}
.fill{height:100%;transition:width .45s cubic-bezier(.22,1,.36,1)}
.d{font-size:10px;font-weight:600;margin-left:4px;vertical-align:1px}
.up{color:var(--int)} .dn{color:var(--cash)}

/* ---- cards ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px;margin-top:13px;animation:rise .32s cubic-bezier(.22,1,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
h2{margin:0 0 9px;font-size:20px;line-height:1.28;letter-spacing:-.015em}
.body{color:#cdd3dd;font-size:16.5px;line-height:1.62}
.choices{margin-top:15px;display:flex;flex-direction:column;gap:8px}
button.choice{
  width:100%;text-align:left;background:var(--panel2);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:13px 14px;font:inherit;font-size:15.5px;
  line-height:1.45;cursor:pointer;transition:transform .09s,background .15s;
}
button.choice:active{transform:scale(.985);background:#2b3240}
button.choice:disabled{opacity:.36;cursor:default}
button.choice .why{display:block;font-size:11.5px;color:var(--faint);margin-top:4px}

.outcome{border-left:2px solid var(--line);padding-left:13px;margin-top:3px;color:#c3cad6;font-size:16px;line-height:1.6}
.log{margin-top:15px;display:flex;flex-direction:column;gap:7px}
.li{font-size:13.5px;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
.li .tag{flex:0 0 auto;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-top:2px}
.t-pay{background:#3a2622;color:#e79b92} .t-appraisal{background:#232833;color:var(--dim)}
.t-promo{background:#1e3b2c;color:#6fd39c} .t-cep{background:#332a15;color:#d9b850}
.t-heat{background:#3a2622;color:#e08b7f} .t-warn{background:#332a15;color:#d9b850}

.primary{
  width:100%;margin-top:16px;background:var(--ink);color:#14171c;border:0;border-radius:9px;
  padding:15px;font:inherit;font-size:16px;font-weight:650;cursor:pointer;transition:transform .09s;
}
.primary:active{transform:scale(.985)}
.ghost{background:none;border:1px solid var(--line);color:var(--dim);font-weight:500}

/* ---- start + ending ---- */
.title{font-size:38px;line-height:1.04;letter-spacing:-.03em;margin:26px 0 7px;font-weight:700}
.tag-line{color:var(--dim);font-size:15px;margin-bottom:22px;line-height:1.5}
input{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:9px;padding:13px 14px;font:inherit;font-size:16px;margin-bottom:9px
}
.origin{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s,background .15s}
.origin[aria-checked=true]{border-color:var(--std);background:#232833}
.origin .n{font-weight:650;font-size:15.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.origin .diff{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);flex:0 0 auto}
.origin .b{font-size:13.5px;color:var(--dim);margin-top:4px;line-height:1.5}

.ending{text-align:center;padding:30px 20px}
.ending .lab{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.ending h1{font-size:31px;margin:11px 0 15px;letter-spacing:-.02em;line-height:1.14}
.ending .ep{color:#c3cad6;font-size:16px;line-height:1.64;text-align:left;margin-bottom:22px}
.final{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}
.final div{background:var(--panel);border-radius:9px;padding:11px}
.final .k{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.final .v{font-size:19px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.hint{color:var(--faint);font-size:12.5px;text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
